<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <!-- Camera -->
  <a-entity id="cam" camera></a-entity>

  <!-- Anchor (empty at first) -->
  <a-entity id="anchor"></a-entity>

  <!-- Video -->
  <a-video
    id="arVideo"
    src="video2.mp4"
    width="1.6"
    height="0.9"
    visible="false"
    autoplay
    loop
    playsinline>
  </a-video>

</a-scene>

<script>
window.addEventListener("load", () => {
  const cam = document.querySelector("#cam");
  const anchor = document.querySelector("#anchor");
  const video = document.querySelector("#arVideo");

  // Wait a bit to ensure camera initialized
  setTimeout(() => {
    const camPos = cam.getAttribute("position");
    const camRot = cam.getAttribute("rotation");

    // Place anchor in front of initial camera direction
    const distance = 3;

    const radY = THREE.MathUtils.degToRad(camRot.y);

    const x = camPos.x - Math.sin(radY) * distance;
    const z = camPos.z - Math.cos(radY) * distance;

    anchor.setAttribute("position", {
      x: x,
      y: camPos.y,
      z: z
    });

    // Attach video to anchor
    anchor.appendChild(video);

    video.setAttribute("position", "0 0 0");
    video.setAttribute("visible", true);

  }, 1000);
});
</script>

</body>
</html>
